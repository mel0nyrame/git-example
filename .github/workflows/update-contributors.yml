name: 更新贡献者头像

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'mel0nyrame/git-example' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 测试生成脚本
        run: python3 -m unittest discover -s .github/scripts -p 'test_update_contributors.py'
      - name: 更新名单和头像
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_contributors.py
      - name: 提交更新
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md .github/contributors.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md .github/contributors.json
          git commit -m 'docs: 同步贡献者头像'
          git push origin HEAD:main
