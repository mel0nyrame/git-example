<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 浮动</title>
    <style>
        .father{
            background-color: aquamarine;
            height: 150px;
            overflow: hidden;
        }
        .left-son{
            width: 100px;
            height: 100px;
            background-color: aqua;
            float: left;
        }
        .right-son{
            width: 100px;
            height: 100px;
            background-color: aqua;
            float: right;
        }
    </style>
</head>
<body>
    <div class="father">
    <div class="left-son">left浮动</div>
    <div class="right-son">right浮动</div>
    </div>
    <p>惠惠万岁惠惠卡哇伊惠惠斯巴拉西惠惠阿姨洗铁路惠惠！！！</p>
</body>
</html>
