<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ning · 自我介绍</title>
<style>
  :root{
    --mint: #7ED9C3;
    --mint-deep: #4EC3A8;
    --sky: #8FD3F4;
    --text: #3A3A3A;
    --muted: #7A8C87;
    --card: rgba(255, 255, 255, .82);
    --radius: 16px;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  body{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, #F7FDFB 0%, #EAF7F3 55%, #E6F4FB 100%);
    position: relative;
    overflow-x: hidden;
  }

  /* 背景装饰：两个模糊色块 */
  .blob{
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .55;
    pointer-events: none;
    z-index: 0;
  }
  .blob-1{ width: 320px; height: 320px; background: #A9EBDC; top: -90px; left: -80px; }
  .blob-2{ width: 280px; height: 280px; background: #BCE4FA; bottom: -100px; right: -70px; }

  /* 主卡片 */
  .card{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
    background: var(--card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 24px;
    padding: 44px 38px 30px;
    box-shadow: 0 18px 45px rgba(94, 165, 148, .16),
                0 2px 8px rgba(94, 165, 148, .06);
  }

  /* ---------- 顶部欢迎区 ---------- */
  .hello{
    text-align: center;
    font-size: clamp(1.6rem, 5vw, 2.15rem);
    font-weight: 700;
    letter-spacing: .06em;
    line-height: 1.35;
  }
  .hello .name{
    background: linear-gradient(120deg, var(--mint-deep), var(--sky));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .intro{
    margin-top: 16px;
    text-align: center;
    font-size: 1rem;
    color: var(--muted);
    letter-spacing: .03em;
  }
  .wish{
    margin-top: 8px;
    text-align: center;
    font-size: .95rem;
    color: var(--muted);
    letter-spacing: .03em;
  }

  /* ---------- 按钮组 ---------- */
  .tabs{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 28px;
  }
  .tab{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    font-family: inherit;
    font-size: .95rem;
    letter-spacing: .03em;
    color: #2F6F62;
    background: #fff;
    border: 1.5px solid rgba(126, 217, 195, .55);
    border-radius: 999px;
    cursor: pointer;
    transition: transform .18s ease, background .25s ease, color .25s ease,
                border-color .25s ease, box-shadow .25s ease;
  }
  .tab:hover{
    transform: translateY(-2px);
    border-color: var(--mint);
    box-shadow: 0 8px 18px rgba(78, 195, 168, .18);
  }
  .tab:active{ transform: scale(.96); }
  .tab:focus-visible{
    outline: 3px solid rgba(143, 211, 244, .7);
    outline-offset: 3px;
  }
  .tab.active{
    background: linear-gradient(120deg, var(--mint), var(--sky));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 10px 22px rgba(78, 195, 168, .30);
  }
  .tab .arrow{
    font-size: .68rem;
    line-height: 1;
    display: inline-block;
  }

  /* ---------- 可展开面板（0fr → 1fr 平滑过渡） ---------- */
  .panel{
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    margin-top: 0;
    transition: grid-template-rows .42s cubic-bezier(.4, 0, .2, 1),
                opacity .35s ease,
                margin-top .42s ease;
  }
  .panel.open{
    grid-template-rows: 1fr;
    opacity: 1;
    margin-top: 22px;
  }
  .panel-inner{
    overflow: hidden;
    min-height: 0;
  }

  /* ---------- 兴趣爱好卡片 ---------- */
  .hobby-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    padding: 4px;
  }
  .hobby{
    background: #fff;
    border: 1px solid rgba(126, 217, 195, .28);
    border-radius: var(--radius);
    padding: 24px 22px;
    box-shadow: 0 6px 16px rgba(94, 165, 148, .08);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .hobby:hover{
    transform: translateY(-4px);
    box-shadow: 0 14px 26px rgba(94, 165, 148, .16);
  }
  .hobby .icon{
    display: block;
    font-size: 1.9rem;
    margin-bottom: 10px;
  }
  .hobby h3{
    font-size: 1.05rem;
    letter-spacing: .04em;
    margin-bottom: 6px;
  }
  .hobby p{
    font-size: .88rem;
    line-height: 1.7;
    color: var(--muted);
  }

  /* ---------- 关于我 ---------- */
  .about-box{
    background: #fff;
    border: 1px solid rgba(143, 211, 244, .38);
    border-radius: var(--radius);
    padding: 22px 24px;
    font-size: .93rem;
    line-height: 1.9;
    color: #4A5A56;
    box-shadow: 0 6px 16px rgba(94, 165, 148, .08);
  }
  .tags{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .tag{
    font-size: .78rem;
    padding: 5px 13px;
    border-radius: 999px;
    color: #3E8C7B;
    background: rgba(126, 217, 195, .18);
    letter-spacing: .04em;
  }

  /* ---------- 页脚 ---------- */
  .foot{
    margin-top: 34px;
    text-align: center;
    font-size: .78rem;
    letter-spacing: .06em;
    color: #A9BDB7;
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 560px){
    .card{ padding: 32px 20px 24px; border-radius: 20px; }
    .hobby-grid{ grid-template-columns: 1fr; }
    .tab{ padding: 10px 18px; font-size: .9rem; }
  }
</style>
</head>
<body>

  <!-- 背景装饰 -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <main class="card">
    <!-- 欢迎区 -->
    <h1 class="hello">你好，我是 <span class="name">ning</span></h1>
    <p class="intro">正在学习 Git 与 GitHub</p>
    <p class="wish">希望在未来的日子里学到更多内容</p>

    <!-- 按钮组 -->
    <div class="tabs">
      <button class="tab" type="button" data-target="panel-hobbies"
              aria-expanded="false" aria-controls="panel-hobbies">
        兴趣爱好 <span class="arrow">▼</span>
      </button>
      <button class="tab" type="button" data-target="panel-about"
              aria-expanded="false" aria-controls="panel-about">
        关于我 <span class="arrow">▼</span>
      </button>
    </div>

    <!-- 面板：兴趣爱好 -->
    <section class="panel" id="panel-hobbies">
      <div class="panel-inner">
        <div class="hobby-grid">
          <article class="hobby">
            <span class="icon">📖</span>
            <h3>看书</h3>
            <p>一页一页慢慢读，把世界读得更大一点。</p>
          </article>
          <article class="hobby">
            <span class="icon">🎧</span>
            <h3>听歌</h3>
            <p>戴上耳机，让旋律陪自己走过每一段时光。</p>
          </article>
        </div>
      </div>
    </section>

    <!-- 面板：关于我 -->
    <section class="panel" id="panel-about">
      <div class="panel-inner">
        <div class="about-box">
          目前正在学习 Git 与 GitHub，喜欢在书本和音乐里放松自己。
          希望把每一次 commit 都写成一点点进步。
          <div class="tags">
            <span class="tag">Git</span>
            <span class="tag">GitHub</span>
            <span class="tag">阅读</span>
            <span class="tag">音乐</span>
          </div>
        </div>
      </div>
    </section>

    <footer class="foot">© ning · 保持学习</footer>
  </main>

<script>
  // 为每个按钮绑定展开 / 收起逻辑
  document.querySelectorAll('.tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var panel = document.getElementById(btn.dataset.target);
      var isOpen = panel.classList.toggle('open');   // 切换展开状态

      btn.classList.toggle('active', isOpen);        // 按钮样式跟随状态
      btn.querySelector('.arrow').textContent = isOpen ? '▲' : '▼';
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  });
</script>

</body>
</html>
