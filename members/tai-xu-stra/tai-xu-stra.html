<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tai-xu-stra 的个人主页</title>
    <style>
        /* 定义浅色和深色的主题变量 */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333333;
            --card-bg: #ffffff;
            --btn-bg: #4CAF50;
            --btn-text: #ffffff;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #1e1e1e;
            --text-color: #f0f0f0;
            --card-bg: #2d2d2d;
            --btn-bg: #bb86fc;
            --btn-text: #000000;
            --shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        /* 基础样式与平滑过渡 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 卡片容器，自适应宽度 */
        .container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: var(--text-color);
            opacity: 0.8;
        }

        /* 切换按钮样式 */
        button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.95);
        }

        /* 针对手机屏幕进行特别调整 */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>你好，我是 tai-xu-stra</h1>
        <p>这里是我的个人介绍网页。这是我使用 AI Agent 完成的杰作，支持深色和浅色模式切换，并且完美适配手机屏幕！</p >
        <button id="themeToggle">切换深色/浅色主题</button>
    </div>

    <script>
        // 获取按钮和 HTML 标签
        const toggleBtn = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        // 检查本地存储中是否已有主题偏好
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
            htmlElement.setAttribute('data-theme', currentTheme);
            updateButtonText(currentTheme);
        }

        // 点击按钮切换主题
        toggleBtn.addEventListener('click', () => {
            let theme = htmlElement.getAttribute('data-theme');
            if (theme === 'dark') {
                htmlElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                updateButtonText('light');
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                updateButtonText('dark');
            }
        });

        // 更新按钮上的文字提示
        function updateButtonText(theme) {
            if (theme === 'dark') {
                toggleBtn.textContent = '☀️ 切换到浅色模式';
            } else {
                toggleBtn.textContent = '🌙 切换到深色模式';
            }
        }
    </script>

</body>
</html>
