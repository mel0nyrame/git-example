<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xwquannnnn · 个人主页</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #171a21;
    --card: #1c2029;
    --accent: #7c5cff;
    --accent-2: #2dd4bf;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,.18), transparent 60%),
                radial-gradient(900px 500px at 0% 100%, rgba(45,212,191,.14), transparent 55%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    line-height: 1.6;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0)) , var(--card);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: var(--radius);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    overflow: hidden;
  }
  .banner {
    height: 120px;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    position: relative;
  }
  .banner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(400px 200px at 70% 30%, rgba(255,255,255,.25), transparent 60%);
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2b2f3a, #11131a);
    border: 4px solid var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin: -52px auto 0;
    position: relative;
    z-index: 2;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .content { padding: 18px 28px 30px; text-align: center; }
  h1 {
    font-size: 26px;
    letter-spacing: .5px;
    margin-top: 12px;
  }
  .handle {
    color: var(--accent-2);
    font-size: 14px;
    margin-top: 4px;
  }
  .greeting {
    margin: 20px 0 8px;
    font-size: 20px;
    font-weight: 600;
  }
  .greeting .emoji { color: #ffd166; }
  .lines {
    text-align: left;
    background: var(--bg-soft);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 12px;
    padding: 16px 18px;
    margin-top: 18px;
    font-size: 15px;
    color: var(--muted);
  }
  .lines p { margin: 6px 0; }
  .lines p strong { color: var(--text); }
  .tag {
    display: inline-block;
    font-size: 12px;
    color: var(--muted);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;
    padding: 3px 10px;
    margin: 14px 4px 0;
  }
  footer {
    margin-top: 22px;
    font-size: 12px;
    color: #6b7280;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fb;
      --bg-soft: #ffffff;
      --card: #ffffff;
      --text: #1b1f27;
      --muted: #5b6472;
    }
    body { background:
      radial-gradient(1000px 500px at 85% -5%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(800px 450px at 0% 100%, rgba(45,212,191,.16), transparent 55%),
      var(--bg); }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="banner"></div>
    <div class="avatar">✦</div>
    <div class="content">
      <h1>Xwquannnnn</h1>
      <div class="handle">@Xwquannnnn · Git 练习仓库成员</div>

      <p class="greeting"><span class="emoji">Hi~</span> o(*￣▽￣*)ブ</p>

      <div class="lines">
        <p><strong>Xwquannnnn is here!</strong></p>
        <p>学点有用的</p>
        <p>做个屌炸天的东西</p>
      </div>

      <div>
        <span class="tag"># 学习 Git</span>
        <span class="tag"># 自我探索</span>
        <span class="tag"># 造点东西</span>
      </div>

      <footer>由 Markdown 生成 · 单文件 · 无外部依赖</footer>
    </div>
  </main>
</body>
</html>
