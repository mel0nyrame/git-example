<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ou-talang | 个人主页</title>
  <style>
    :root {
      --bg-primary: #fafafa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f5f5f5;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8888a0;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #e0e0e8;
      --shadow: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      --transition: all 0.3s ease;
    }

    [data-theme="dark"] {
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-tertiary: #22223a;
      --text-primary: #f0f0f5;
      --text-secondary: #b0b0c8;
      --text-muted: #707090;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --border: #2a2a4a;
      --shadow: rgba(0, 0, 0, 0.3);
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      transition: var(--transition);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: var(--card-shadow);
      font-size: 2.5rem;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .nickname {
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: var(--text-secondary);
      font-weight: 400;
    }

    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 100;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.6rem 1.2rem;
      font-size: 0.875rem;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: var(--card-shadow);
      transition: var(--transition);
    }

    .theme-toggle:hover {
      background: var(--bg-tertiary);
      transform: translateY(-2px);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      transition: var(--transition);
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--card-shadow);
      transition: var(--transition);
    }

    .card:hover {
      box-shadow: 0 8px 30px var(--shadow);
      transform: translateY(-2px);
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card h2::before {
      content: "";
      width: 4px;
      height: 20px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--accent), #8b5cf6);
    }

    .direction {
      font-size: 1.1rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .direction strong {
      color: var(--text-primary);
    }

    .goals {
      list-style: none;
    }

    .goals li {
      position: relative;
      padding-left: 1.5rem;
      margin-bottom: 0.875rem;
      color: var(--text-secondary);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .goals li:last-child {
      margin-bottom: 0;
    }

    .goals li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.65em;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    @media (max-width: 480px) {
      .container {
        padding: 2rem 1rem;
      }

      .theme-toggle {
        top: 1rem;
        right: 1rem;
        padding: 0.5rem 1rem;
        font-size: 0.8rem;
      }

      .card {
        padding: 1.5rem;
      }

      .avatar {
        width: 80px;
        height: 80px;
        font-size: 2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换主题">
    <svg id="sunIcon" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg id="moonIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <span id="themeText">暗色模式</span>
  </button>

  <main class="container">
    <header>
      <div class="avatar">OT</div>
      <h1>ou-talang</h1>
      <p class="nickname">你也可以叫我 <strong>欧文</strong>，虽然我并不擅长打篮球 🏀</p>
    </header>

    <section class="card">
      <h2>学习方向</h2>
      <p class="direction"><strong>深度学习（人工智能）</strong></p>
    </section>

    <section class="card">
      <h2>学习目标</h2>
      <ul class="goals">
        <li>尽早完成第二轮踏浪的考核</li>
        <li>完成一个小项目</li>
      </ul>
    </section>

    <footer>
      <p>Made with ❤️ by ou-talang</p>
    </footer>
  </main>

  <script>
    (function () {
      const toggle = document.getElementById('themeToggle');
      const sunIcon = document.getElementById('sunIcon');
      const moonIcon = document.getElementById('moonIcon');
      const themeText = document.getElementById('themeText');
      const html = document.documentElement;

      function applyTheme(theme) {
        html.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          sunIcon.style.display = 'block';
          moonIcon.style.display = 'none';
          themeText.textContent = '亮色模式';
        } else {
          sunIcon.style.display = 'none';
          moonIcon.style.display = 'block';
          themeText.textContent = '暗色模式';
        }
      }

      function getInitialTheme() {
        const saved = localStorage.getItem('theme');
        if (saved) return saved;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      applyTheme(getInitialTheme());

      toggle.addEventListener('click', function () {
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        applyTheme(next);
      });

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem('theme')) {
          applyTheme(e.matches ? 'dark' : 'light');
        }
      });
    })();
  </script>
</body>
</html>
