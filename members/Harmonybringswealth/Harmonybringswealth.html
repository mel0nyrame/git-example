<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmonybringswealth · 个人介绍</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #5b6577;
    --line: #e3e7ef;
    --accent: #3b6ef5;
  }
  [data-theme="dark"] {
    --bg: #10141c;
    --card: #171d28;
    --text: #e8edf7;
    --muted: #9aa6bb;
    --line: #26303f;
    --accent: #6f9bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    transition: background .25s, color .25s;
  }
  .card {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: clamp(20px, 4vw, 36px);
    box-shadow: 0 18px 40px rgba(15, 23, 42, .08);
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .who { display: flex; align-items: center; gap: 14px; }
  .avatar {
    width: 56px; height: 56px;
    flex: 0 0 56px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent);
    color: #fff;
    font-size: 24px;
    font-weight: 700;
  }
  h1 { margin: 0; font-size: clamp(20px, 4vw, 26px); letter-spacing: .5px; }
  .tag {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  button {
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    transition: border-color .2s, color .2s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  h2 {
    font-size: 15px;
    margin: 28px 0 10px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: .5px;
  }
  ul { margin: 0; padding-left: 20px; }
  li { margin: 6px 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .pill {
    font-size: 13px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
  }
  footer {
    margin-top: 30px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  @media (max-width: 420px) {
    .avatar { width: 46px; height: 46px; flex-basis: 46px; font-size: 20px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="top">
      <div class="who">
        <div class="avatar">H</div>
        <div>
          <h1>Harmonybringswealth</h1>
          <p class="tag">正在探索学习方向</p>
        </div>
      </div>
      <button id="themeBtn" type="button">切换主题</button>
    </div>

    <div class="meta">
      <span class="pill">Git 入门</span>
      <span class="pill">Pull Request 协作</span>
    </div>

    <h2>学习目标</h2>
    <ul>
      <li>学会使用 git</li>
      <li>学习如何使用 PR</li>
    </ul>

    <h2>关于这个页面</h2>
    <p>单文件 HTML，样式与脚本都写在文件里，不依赖任何框架、外部图片或字体，双击即可在浏览器打开。</p>

    <footer>踏浪团队 · 第一次实操</footer>
  </main>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById("themeBtn");

    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", prefersDark ? "dark" : "light");

    btn.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      btn.textContent = next === "dark" ? "切换到浅色" : "切换到深色";
    });
  })();
</script>
</body>
</html>
