<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>taoruiran · 个人介绍</title>
<style>
  :root {
    --bg: #f6f7fb;
    --bg-soft: #ffffff;
    --text: #16181d;
    --text-muted: #5b6270;
    --border: #e4e6ec;
    --accent: #4f46e5;
    --accent-soft: rgba(79, 70, 229, 0.1);
    --shadow: 0 12px 40px rgba(20, 22, 30, 0.08);
    --radius: 18px;
  }

  html[data-theme="dark"] {
    --bg: #0d1017;
    --bg-soft: #161a23;
    --text: #eef1f7;
    --text-muted: #9aa3b4;
    --border: #262c3a;
    --accent: #8b87ff;
    --accent-soft: rgba(139, 135, 255, 0.14);
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.35s ease, color 0.35s ease;
  }

  /* 背景装饰光斑 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.35s ease;
  }

  body::before {
    width: 340px;
    height: 340px;
    top: -120px;
    right: -100px;
    background: var(--accent);
    opacity: 0.18;
  }

  body::after {
    width: 280px;
    height: 280px;
    bottom: -110px;
    left: -90px;
    background: #22d3ee;
    opacity: 0.14;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(28px, 5vw, 48px);
    box-shadow: var(--shadow);
    transition: background-color 0.35s ease, border-color 0.35s ease,
      box-shadow 0.35s ease;
  }

  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 26px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 7px 13px;
    border-radius: 999px;
  }

  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .theme-btn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 50%;
    transition: background-color 0.25s ease, border-color 0.25s ease,
      transform 0.25s ease;
  }

  .theme-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    transform: rotate(-12deg);
  }

  .theme-btn:active {
    transform: scale(0.92);
  }

  .theme-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  h1 {
    font-size: clamp(30px, 6vw, 44px);
    line-height: 1.15;
    letter-spacing: -0.03em;
    font-weight: 800;
    margin-bottom: 14px;
  }

  h1 .grad {
    background: linear-gradient(100deg, var(--accent), #22d3ee 90%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  .subtitle {
    font-size: clamp(14px, 2.4vw, 16px);
    line-height: 1.75;
    color: var(--text-muted);
    max-width: 46ch;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 30px 0 26px;
    border: 0;
  }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .goals {
    list-style: none;
    display: grid;
    gap: 12px;
  }

  .goal {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: transparent;
    transition: border-color 0.25s ease, background-color 0.25s ease,
      transform 0.25s ease;
  }

  .goal:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateX(4px);
  }

  .goal-num {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 9px;
  }

  .goal-text {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
  }

  footer {
    margin-top: 30px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    color: var(--text-muted);
  }

  footer .user-tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text);
    font-weight: 600;
  }

  @media (max-width: 480px) {
    body {
      padding: 18px 14px;
      align-items: flex-start;
    }
    .card {
      padding: 24px 20px;
      border-radius: 16px;
    }
    .goal {
      padding: 14px;
      gap: 12px;
    }
    .goal:hover {
      transform: none;
    }
    footer {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="top">
      <span class="badge"><span class="dot"></span>Hello</span>
      <button
        id="themeBtn"
        class="theme-btn"
        type="button"
        aria-label="切换深色/浅色主题"
        title="切换深色/浅色主题"
      >🌙</button>
    </div>

    <h1>你好，我是 <span class="grad">taoruiran</span></h1>
    <p class="subtitle">
      一名正在学习协作开发与 AI 编程的探索者，喜欢用简洁的方式把想法变成能跑起来的代码。
    </p>

    <hr class="divider">

    <p class="section-label">我的学习目标</p>
    <ul class="goals">
      <li class="goal">
        <span class="goal-num">01</span>
        <span class="goal-text">学会使用 Git</span>
      </li>
      <li class="goal">
        <span class="goal-num">02</span>
        <span class="goal-text">学会发起 PR</span>
      </li>
      <li class="goal">
        <span class="goal-num">03</span>
        <span class="goal-text">学会用 Agent 写代码</span>
      </li>
    </ul>

    <footer>
      <span>Made with ❤️ &amp; a little help from AI</span>
      <span class="user-tag">@taoruiran</span>
    </footer>
  </main>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById("themeBtn");

    function applyTheme(theme) {
      root.setAttribute("data-theme", theme);
      var isDark = theme === "dark";
      btn.textContent = isDark ? "☀️" : "🌙";
      btn.setAttribute("aria-label", isDark ? "切换到浅色主题" : "切换到深色主题");
      btn.setAttribute("title", isDark ? "切换到浅色主题" : "切换到深色主题");
    }

    // 优先读取本地保存的主题，否则跟随系统偏好
    var saved = null;
    try {
      saved = localStorage.getItem("taoruiran-theme");
    } catch (e) {
      saved = null;
    }

    var initial = saved;
    if (initial !== "dark" && initial !== "light") {
      initial =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
    }
    applyTheme(initial);

    btn.addEventListener("click", function () {
      var next =
        root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      try {
        localStorage.setItem("taoruiran-theme", next);
      } catch (e) {
        /* 隐私模式下忽略存储失败 */
      }
    });
  })();
</script>
</body>
</html>
