<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>huiliyi911225 · 神秘人</title>
<style>
  :root {
    --bg: #0b0d17;
    --bg-soft: #121629;
    --card: rgba(255, 255, 255, 0.04);
    --line: rgba(255, 255, 255, 0.1);
    --text: #e8eaf6;
    --muted: #9aa3c7;
    --accent: #7c5cff;
    --accent-2: #00e5c3;
    --accent-3: #ff5c8a;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 600px at 15% -10%, rgba(124, 92, 255, 0.28), transparent 60%),
      radial-gradient(800px 500px at 90% 0%, rgba(0, 229, 195, 0.14), transparent 55%),
      radial-gradient(700px 700px at 50% 110%, rgba(255, 92, 138, 0.12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* 背景网格 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: min(960px, 100% - 48px);
    margin: 0 auto;
    padding: 72px 0 56px;
  }

  /* ---------- Hero ---------- */
  .hero {
    display: flex;
    align-items: center;
    gap: 36px;
    padding: 40px;
    border: 1px solid var(--line);
    border-radius: 28px;
    background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.8);
    position: relative;
    overflow: hidden;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .hero::after {
    content: "";
    position: absolute;
    top: -60%;
    right: -20%;
    width: 420px;
    height: 420px;
    background: radial-gradient(circle, rgba(124, 92, 255, 0.35), transparent 65%);
    filter: blur(10px);
    pointer-events: none;
  }

  .avatar {
    flex: 0 0 auto;
    width: 118px;
    height: 118px;
    border-radius: 32px;
    display: grid;
    place-items: center;
    font-size: 54px;
    font-weight: 700;
    letter-spacing: -2px;
    color: #0b0d17;
    background: linear-gradient(135deg, var(--accent-2), var(--accent) 55%, var(--accent-3));
    box-shadow: 0 18px 40px -12px rgba(124, 92, 255, 0.7);
    position: relative;
    animation: float 5s ease-in-out infinite;
  }

  .avatar::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 38px;
    border: 1px dashed rgba(255, 255, 255, 0.25);
    animation: spin 18s linear infinite;
  }

  .hero-text { min-width: 0; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 12px;
  }

  .eyebrow .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 0 4px rgba(0, 229, 195, 0.15);
    animation: pulse 2s ease-in-out infinite;
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(32px, 6vw, 52px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    background: linear-gradient(100deg, #fff 20%, #b8a8ff 55%, #7af5df 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    margin: 0;
    font-size: clamp(15px, 2.4vw, 18px);
    color: var(--muted);
    max-width: 46ch;
  }

  .tagline strong {
    color: var(--text);
    font-weight: 600;
  }

  /* ---------- Sections ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 22px;
    margin-top: 22px;
  }

  .card {
    padding: 30px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--card);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform 0.35s ease, border-color 0.35s ease, background 0.35s ease;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: 0.15s;
  }

  .card:nth-child(2) { animation-delay: 0.25s; }

  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(124, 92, 255, 0.45);
    background: rgba(124, 92, 255, 0.07);
  }

  .card h2 {
    margin: 0 0 16px;
    font-size: 14px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-2);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }

  .card p { margin: 0; color: #c9cfe8; }
  .card p + p { margin-top: 12px; }

  .quote {
    font-size: 20px;
    line-height: 1.6;
    color: var(--text);
    position: relative;
    padding-left: 22px;
  }

  .quote::before {
    content: "";
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 3px;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent-3));
  }

  .muted { color: var(--muted); font-size: 14px; }

  /* ---------- Tags ---------- */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
  }

  .tag {
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    color: #d7dbf2;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.03);
    transition: all 0.25s ease;
    cursor: default;
  }

  .tag:hover {
    color: #0b0d17;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    border-color: transparent;
    transform: translateY(-2px);
  }

  /* ---------- Status strip ---------- */
  .strip {
    margin-top: 22px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .stat {
    padding: 22px 24px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--card);
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: 0.35s;
  }

  .stat:nth-child(2) { animation-delay: 0.42s; }
  .stat:nth-child(3) { animation-delay: 0.49s; }

  .stat .label {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stat .value {
    margin-top: 6px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .stat .value .accent { color: var(--accent-2); }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 48px;
    padding-top: 26px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
  }

  .footer-mark {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .footer-mark .pip {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }

  /* ---------- Animations ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  @media (max-width: 760px) {
    .wrap { width: min(960px, 100% - 28px); padding: 36px 0 36px; }
    .hero {
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
      padding: 28px;
    }
    .grid { grid-template-columns: 1fr; }
    .strip { grid-template-columns: 1fr; }
    .avatar { width: 92px; height: 92px; font-size: 42px; border-radius: 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <main class="wrap">

    <section class="hero">
      <div class="avatar" aria-hidden="true">H</div>
      <div class="hero-text">
        <span class="eyebrow"><span class="dot"></span>Player One · Ready</span>
        <h1>huiliyi911225</h1>
        <p class="tagline">
          <strong>这个人很神秘，什么都没有写。</strong><br>
          但至少……他喜欢玩游戏。
        </p>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>自我介绍</h2>
        <p class="quote">“这个家伙很神秘，什么都没有留下。”</p>
        <p class="muted" style="margin-top:14px;">既然如此，那就把这份空白交给想象力吧。</p>
      </section>

      <section class="card">
        <h2>兴趣</h2>
        <p>喜欢玩游戏 —— 大概是唯一公开的情报。</p>
        <div class="tags">
          <span class="tag">🎮 游戏</span>
          <span class="tag">🕹️ 休闲</span>
          <span class="tag">🏆 挑战</span>
          <span class="tag">👾 神秘</span>
        </div>
      </section>
    </div>

    <div class="strip">
      <div class="stat">
        <div class="label">Status</div>
        <div class="value"><span class="accent">● </span>在线</div>
      </div>
      <div class="stat">
        <div class="label">Class</div>
        <div class="value">神秘玩家</div>
      </div>
      <div class="stat">
        <div class="label">Motto</div>
        <div class="value">下一局再说</div>
      </div>
    </div>

    <footer>
      <span class="footer-mark"><span class="pip"></span>huiliyi911225.md</span>
      <span>© 2026 huiliyi911225 · 保留所有神秘</span>
    </footer>

  </main>
</body>
</html>
