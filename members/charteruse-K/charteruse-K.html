<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>charteruse-K 的个人介绍</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6fb;
    --bg-gradient: radial-gradient(circle at 20% 10%, #dbe6ff 0%, transparent 55%),
                   radial-gradient(circle at 85% 85%, #ffe3d6 0%, transparent 50%);
    --card: #ffffff;
    --fg: #1c2333;
    --fg-muted: #5a6478;
    --accent: #2f6bff;
    --accent-soft: #e7edff;
    --border: #dfe4ee;
    --shadow: 0 10px 30px rgba(28, 35, 51, 0.10);
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f131c;
    --bg-gradient: radial-gradient(circle at 20% 10%, #1b2a44 0%, transparent 55%),
                   radial-gradient(circle at 85% 85%, #2a1d1a 0%, transparent 50%);
    --card: #171d29;
    --fg: #e8ecf5;
    --fg-muted: #9aa5bb;
    --accent: #7aa2ff;
    --accent-soft: #1f2a44;
    --border: #2a3346;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 "Noto Sans SC", system-ui, -apple-system, sans-serif;
    line-height: 1.7;
    color: var(--fg);
    background-color: var(--bg);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    transition: background-color .3s ease, color .3s ease;
    padding: clamp(16px, 4vw, 48px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrap {
    width: 100%;
    max-width: 720px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: clamp(20px, 5vw, 40px);
    box-shadow: var(--shadow);
    transition: background-color .3s ease, border-color .3s ease, box-shadow .3s ease;
  }

  .top {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: space-between;
  }

  .identity {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }

  .avatar {
    flex: 0 0 auto;
    width: clamp(52px, 12vw, 68px);
    height: clamp(52px, 12vw, 68px);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    letter-spacing: .5px;
    user-select: none;
  }

  h1 {
    margin: 0;
    font-size: clamp(22px, 5.5vw, 30px);
    line-height: 1.3;
    word-break: break-word;
  }

  .label {
    margin: 0;
    font-size: clamp(13px, 3vw, 14px);
    color: var(--fg-muted);
    letter-spacing: .08em;
  }

  .value {
    margin: 2px 0 0;
    font-size: clamp(15px, 3.6vw, 17px);
    font-weight: 600;
    word-break: break-word;
  }

  .tag {
    display: inline-block;
    margin-top: 4px;
    padding: 3px 12px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: clamp(13px, 3vw, 14px);
    font-weight: 600;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: clamp(20px, 5vw, 28px) 0;
  }

  h2 {
    margin: 0 0 14px;
    font-size: clamp(17px, 4vw, 19px);
    letter-spacing: .04em;
  }

  ol.goals {
    margin: 0;
    padding: 0;
    list-style: none;
    counter-reset: goal;
    display: grid;
    gap: 12px;
  }

  ol.goals li {
    counter-increment: goal;
    position: relative;
    padding: 14px 16px 14px 52px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: clamp(15px, 3.6vw, 16px);
    transition: background-color .3s ease, border-color .3s ease;
  }

  ol.goals li::before {
    content: counter(goal);
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }

  footer {
    margin-top: clamp(18px, 4vw, 26px);
    font-size: clamp(12px, 3vw, 13px);
    color: var(--fg-muted);
    text-align: center;
  }

  /* 主题切换按钮 */
  .theme-toggle {
    position: fixed;
    top: clamp(12px, 3vw, 20px);
    right: clamp(12px, 3vw, 20px);
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: background-color .3s ease, color .3s ease,
                border-color .3s ease, transform .15s ease;
  }

  .theme-toggle:hover { transform: translateY(-2px); }
  .theme-toggle:active { transform: translateY(0); }

  .theme-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .theme-toggle .icon { font-size: 16px; line-height: 1; }

  /* 窄窗口 */
  @media (max-width: 600px) {
    body { padding: 16px; align-items: flex-start; }

    .card { padding: 20px 16px; border-radius: 14px; }

    .top { flex-direction: column; align-items: flex-start; gap: 12px; }

    .theme-toggle {
      position: static;
      width: 100%;
      justify-content: center;
      order: -1;
      margin-bottom: 4px;
    }

    ol.goals li { padding: 12px 12px 12px 46px; }
    ol.goals li::before { left: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="切换到深色主题">
  <span class="icon" id="themeIcon" aria-hidden="true">🌙</span>
  <span id="themeText">深色</span>
</button>

<main class="wrap">
  <article class="card">
    <div class="top">
      <div class="identity">
        <div class="avatar" aria-hidden="true">K</div>
        <div>
          <p class="label">昵称</p>
          <h1>charteruse-K</h1>
        </div>
      </div>
      <div>
        <p class="label">学习方向</p>
        <p class="value">深度学习</p>
        <span class="tag">Deep Learning</span>
      </div>
    </div>

    <hr>

    <section>
      <h2>学习目标</h2>
      <ol class="goals">
        <li>熟练掌握 Git 和 AI 工具的使用。</li>
        <li>独立完成一个个人网页项目。</li>
      </ol>
    </section>

    <footer>本页面由 charteruse-K 维护 · 单文件 HTML（内联 CSS / JavaScript）</footer>
  </article>
</main>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var icon = document.getElementById('themeIcon');
    var text = document.getElementById('themeText');
    var KEY = 'charteruse-K-theme';

    function apply(theme) {
      var dark = theme === 'dark';
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      icon.textContent = dark ? '☀️' : '🌙';
      text.textContent = dark ? '浅色' : '深色';
      btn.setAttribute('aria-label', dark ? '切换到浅色主题' : '切换到深色主题');
      btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    }

    // 初始：优先本地记忆，其次系统偏好
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved !== 'light' && saved !== 'dark') {
      saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark' : 'light';
    }
    apply(saved);

    btn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      apply(next);
      try { localStorage.setItem(KEY, next); } catch (e) {}
    });
  })();
</script>
</body>
</html>
