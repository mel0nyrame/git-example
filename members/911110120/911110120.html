<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XZF（911110120）· 个人介绍</title>
<style>
  :root {
    --bg: #f4f6fb;
    --bg-grad-1: #e7ecf8;
    --bg-grad-2: #f7f5ef;
    --card: #ffffff;
    --card-border: #e2e6f0;
    --surface: #f2f5fb;
    --text: #1d2233;
    --text-soft: #454d61;
    --text-muted: #626a7e;
    --accent: #2f5fd0;
    --accent-soft: #e6edff;
    --accent-text: #ffffff;
    --chip-bg: #fdf3e0;
    --chip-text: #7d5109;
    --shadow: 0 6px 24px rgba(24, 33, 60, 0.08);
    --shadow-sm: 0 2px 10px rgba(24, 33, 60, 0.06);
  }

  html[data-theme="dark"] {
    --bg: #0d1017;
    --bg-grad-1: #141926;
    --bg-grad-2: #1a1a24;
    --card: #1e2431;
    --card-border: #3a4358;
    --surface: #262d3d;
    --text: #f4f6fb;
    --text-soft: #d5dae6;
    --text-muted: #aab3c6;
    --accent: #93b4ff;
    --accent-soft: #2c3a5c;
    --accent-text: #0d1017;
    --chip-bg: #4a3d1c;
    --chip-text: #ffd894;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  html {
    color-scheme: light;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background-color: var(--bg);
    background-image: linear-gradient(160deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
    background-attachment: fixed;
    line-height: 1.7;
    overflow-x: hidden;
    transition: background-color .25s ease, color .25s ease;
  }

  .wrap {
    width: 100%;
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 16px 56px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .topbar-title {
    font-size: 0.9rem;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    margin: 0;
    min-width: 0;
  }

  .theme-btn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    font: inherit;
    font-size: 0.9rem;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform .15s ease, background-color .2s ease, border-color .2s ease, color .2s ease;
  }

  .theme-btn:hover { transform: translateY(-1px); }
  .theme-btn:active { transform: translateY(0); }

  .theme-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .theme-icon {
    display: inline-block;
    font-size: 1rem;
    line-height: 1;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: clamp(18px, 4vw, 32px);
    margin-bottom: 18px;
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent-text);
    background: var(--accent);
    letter-spacing: 0.02em;
  }

  .name {
    margin: 0 0 6px;
    font-size: clamp(1.5rem, 5vw, 2rem);
    line-height: 1.3;
    color: var(--text);
    overflow-wrap: anywhere;
  }

  .role {
    margin: 0 0 16px;
    color: var(--text-soft);
    font-size: 1rem;
  }

  .chip {
    display: inline-block;
    max-width: 100%;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--chip-text);
    font-size: 0.88rem;
    font-weight: 600;
    overflow-wrap: anywhere;
  }

  h2 {
    margin: 0 0 12px;
    font-size: clamp(1.15rem, 3.6vw, 1.35rem);
    color: var(--text);
  }

  .goals {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 12px;
  }

  .goals li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 16px;
    border: 1px solid var(--card-border);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-soft);
    overflow-wrap: anywhere;
  }

  .goals .num {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent-text);
    background: var(--accent);
  }

  .goals .txt { flex: 1 1 auto; min-width: 0; }

  .note {
    margin: 0;
    font-size: 0.9rem;
    color: var(--text-muted);
    overflow-wrap: anywhere;
  }

  .note code {
    font-family: Consolas, "Courier New", monospace;
    font-size: 0.9em;
    background: var(--accent-soft);
    color: var(--text);
    padding: 1px 6px;
    border-radius: 5px;
    overflow-wrap: anywhere;
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    padding-top: 4px;
  }

  @media (max-width: 420px) {
    .wrap { padding: 16px 12px 40px; }
    .topbar { margin-bottom: 14px; }
    .avatar { width: 60px; height: 60px; font-size: 1.2rem; }
    .goals li { padding: 12px 12px; gap: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <p class="topbar-title">个人介绍</p>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="切换深色/浅色主题" aria-pressed="false">
        <span class="theme-icon" id="themeIcon" aria-hidden="true">🌙</span>
        <span id="themeText">深色模式</span>
      </button>
    </div>

    <main>
      <section class="card">
        <div class="avatar" aria-hidden="true">XZF</div>
        <h1 class="name">XZF</h1>
        <p class="role">GitHub 用户名：<strong>911110120</strong></p>
        <p class="role">学习方向：<span class="chip">正在探索</span></p>
        <p class="note">方向尚未在介绍文件中确定，目前以 <strong>Git</strong> 协作实践为主线，边学边确定。</p>
      </section>

      <section class="card">
        <h2>学习目标</h2>
        <ul class="goals">
          <li>
            <span class="num" aria-hidden="true">1</span>
            <span class="txt">学会使用 Git 管理改动。</span>
          </li>
          <li>
            <span class="num" aria-hidden="true">2</span>
            <span class="txt">学会通过 PR 参与协作。</span>
          </li>
        </ul>
      </section>

      <section class="card">
        <h2>关于这份介绍</h2>
        <p class="note">
          本页内容整理自个人介绍文件 <code>members/911110120/911110120.md</code>，
          只保留其中已写明的信息：两条学习目标；学习方向文件未提及，写作「正在探索」；
          文件未提及的经历与技能未作补充。
        </p>
      </section>
    </main>

    <footer>由 XZF（911110120）维护 · 单文件页面，无外部依赖</footer>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = 'member-911110120-theme';
      var root = document.documentElement;
      var btn = document.getElementById('themeBtn');
      var icon = document.getElementById('themeIcon');
      var text = document.getElementById('themeText');
      var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

      function apply(theme) {
        root.setAttribute('data-theme', theme);
        var dark = theme === 'dark';
        icon.textContent = dark ? '☀️' : '🌙';
        text.textContent = dark ? '浅色模式' : '深色模式';
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
      }

      function store(theme) {
        try { window.localStorage.setItem(STORAGE_KEY, theme); } catch (e) { /* 忽略隐私模式等限制 */ }
      }

      function read() {
        try { return window.localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
      }

      var saved = read();
      if (saved === 'dark' || saved === 'light') {
        apply(saved);
      } else {
        apply(media && media.matches ? 'dark' : 'light');
      }

      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        apply(next);
        store(next);
      });

      if (media) {
        var onChange = function (e) {
          if (!read()) apply(e.matches ? 'dark' : 'light');
        };
        if (media.addEventListener) media.addEventListener('change', onChange);
        else if (media.addListener) media.addListener(onChange);
      }
    })();
  </script>
</body>
</html>
