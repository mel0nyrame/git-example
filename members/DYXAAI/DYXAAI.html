    --star: #f4e2ad;
    --star-glow: rgba(232, 196, 106, 0.55);

    --text: #f4f6fb;
    --gold: #e8c46a;
    --footer: #e9edf5;
    --footer-shadow: 0 1px 8px rgba(2, 6, 14, 0.7);

    --overlay: rgba(8, 12, 28, 0.6);
    --btn-bg: rgba(10, 16, 32, 0.5);
    --btn-border: rgba(232, 196, 106, 0.32);

    --title-glow:
      0 0 12px rgba(232, 196, 106, 0.55),
      0 0 34px rgba(232, 196, 106, 0.32),
      0 0 70px rgba(232, 196, 106, 0.16);
  }

  html[data-theme="light"] {
    --star: #b48c33;
    --star-glow: rgba(180, 140, 51, 0.5);

    --text: #1b2430;
    --gold: #7a5a12;
    --footer: #1b2430;
    --footer-shadow: 0 1px 6px rgba(255, 255, 255, 0.6);

    --overlay: rgba(248, 244, 234, 0.8);
    --btn-bg: rgba(255, 255, 255, 0.62);
    --btn-border: rgba(150, 116, 40, 0.45);

    --title-glow:
      0 0 12px rgba(200, 162, 74, 0.42),
      0 0 30px rgba(200, 162, 74, 0.26),
      0 0 60px rgba(200, 162, 74, 0.14);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(1rem, 3.5vw, 2rem) clamp(0.9rem, 4vw, 2rem);

    background-color: #080c1c;
    background-image:
      radial-gradient(circle at 50% -10%, rgba(232, 196, 106, 0.1), transparent 55%),
      linear-gradient(var(--overlay), var(--overlay)),
      var(--bg-photo);
    background-repeat: no-repeat, no-repeat, no-repeat;
    background-position: center top, center center, center center;
    background-size: cover, cover, cover;
    background-attachment: fixed, fixed, fixed;

    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    transition: color 0.25s ease;
    overflow-x: hidden;
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .stars span {
    position: absolute;
    width: var(--size, 4px);
    height: var(--size, 4px);
    border-radius: 50%;
    background: var(--star);
    box-shadow: 0 0 8px 2px var(--star-glow);
    opacity: 0.2;
    animation: twinkle 2s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% {
      opacity: 0.15;
      transform: scale(0.75);
    }
    50% {
      opacity: 1;
      transform: scale(1.15);
    }
  }

  .s1 { left: 8%;  top: 16%; --size: 5px; animation-delay: 0s; }
  .s2 { left: 22%; top: 62%; --size: 3px; animation-delay: 0.3s; }
  .s3 { left: 37%; top: 28%; --size: 6px; animation-delay: 0.6s; }
  .s4 { left: 52%; top: 78%; --size: 3px; animation-delay: 0.9s; }
  .s5 { left: 68%; top: 20%; --size: 4px; animation-delay: 1.2s; }
  .s6 { left: 81%; top: 56%; --size: 3px; animation-delay: 1.5s; }
  .s7 { left: 92%; top: 34%; --size: 5px; animation-delay: 0.45s; }
  .s8 { left: 12%; top: 86%; --size: 3px; animation-delay: 1.05s; }
  .s9 { left: 63%; top: 8%;  --size: 4px; animation-delay: 1.35s; }

  .topbar {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    justify-content: flex-end;
  }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    max-width: 100%;
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--btn-border);
    border-radius: 999px;
    background: var(--btn-bg);
    color: var(--text);
    font: inherit;
    font-size: 0.85rem;
    line-height: 1.3;
    cursor: pointer;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }

  .theme-toggle:hover {
    border-color: var(--gold);
  }

  .theme-toggle:active {
    transform: translateY(1px);
  }

  .theme-toggle:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  .theme-toggle .icon {
    font-size: 0.95rem;
    line-height: 1;
    color: var(--gold);
  }

  .hero {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.5rem, 5vh, 3.25rem);
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: clamp(1.5rem, 7vh, 5rem) 0;
    text-align: center;
  }

  .hero h1 {
    margin: 0;
    padding-left: 0.16em;
    font-size: clamp(2.6rem, 13vw, 7rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: 0.16em;
    white-space: nowrap;
    color: var(--gold);
    text-shadow: var(--title-glow);
  }

  .corner {
    position: fixed;
    z-index: 1;
    margin: 0;
    max-width: 86vw;
    font-family: 'Noto Serif SC', 'STZhongsong', SimSun, serif;
    font-weight: 700;
    font-size: 23px;
    letter-spacing: 0.28em;
    line-height: 1.6;
    color: #EDE3D0;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
  }

  .corner-top {
    top: 9%;
    left: 7%;
    text-align: left;
  }

  .corner-bottom {
    right: 7%;
    bottom: max(11%, 3.5rem);
    text-align: right;
  }

  html[data-theme="light"] .corner {
    color: #5a4620;
    text-shadow: 0 2px 12px rgba(255, 255, 255, 0.5);
  }

  .char {
    display: inline-block;
    opacity: 0;
    animation: charIn 0.55s ease-out both;
  }

  @keyframes charIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .page-footer {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 60rem;
    margin: 0 auto;
    padding-bottom: clamp(0.5rem, 3vh, 1.5rem);
    opacity: 0.6;
    color: var(--footer);
    font-size: clamp(0.72rem, 1.6vw, 0.82rem);
    line-height: 1.9;
    letter-spacing: 0.06em;
    text-align: center;
    text-wrap: pretty;
    overflow-wrap: anywhere;
    text-shadow: var(--footer-shadow);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 640px) {
    .hero h1 {
      letter-spacing: 0.12em;
      padding-left: 0.12em;
    }

    .corner {
      max-width: 90vw;
    }

    .corner-top {
      top: 5%;
      left: 5%;
    }

    .corner-bottom {
      right: 5%;
      bottom: max(5%, 3.5rem);
    }

    .page-footer {
      max-width: 26rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    body,
    .theme-toggle,
    .stars span {
      transition: none;
    }

    .stars span {
      animation: none;
      opacity: 0.7;
    }

    .char {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }

  @media print {
    .theme-toggle,
    .page-footer,
    .stars {
      display: none;
    }

    body {
      background: #ffffff;
      color: #000000;
    }
  }
</style>
</head>

  <script>
    (function () {
      var root = document.documentElement;
      var button = document.getElementById("themeToggle");
      var label = document.getElementById("themeLabel");
      var icon = document.getElementById("themeIcon");
      var storageKey = "dyxaii-theme";

      function readStored() {
        try {
          return window.localStorage.getItem(storageKey);
        } catch (error) {
          return null;
        }
      }

      function store(theme) {
        try {
          window.localStorage.setItem(storageKey, theme);
        } catch (error) {
          /* 本地文件或隐私模式下可能不可用，忽略即可 */
        }
      }

      function apply(theme) {
        var dark = theme === "dark";
        root.setAttribute("data-theme", dark ? "dark" : "light");
        button.setAttribute("aria-pressed", String(dark));
        label.textContent = dark ? "切换浅色主题" : "切换深色主题";
        icon.textContent = dark ? "☀" : "◐";
        button.setAttribute("aria-label", dark ? "切换浅色主题" : "切换深色主题");
      }

      var stored = readStored();
      apply(stored === "light" ? "light" : "dark");

      button.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        apply(next);
        store(next);
      });
    })();
  </script>
