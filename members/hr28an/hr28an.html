<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>hr28an · 个人介绍</title>
<style>
  :root {
    --bg: #0f172a;
    --bg-soft: #1b2740;
    --card: #16213a;
    --line: #2c3d5e;
    --text: #e8eefc;
    --muted: #b6c4dd;
    --accent: #6ee7b7;
    --accent-2: #7dd3fc;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    padding: 24px 16px 40px;
    background:
      radial-gradient(1000px 500px at 15% -10%, #1e3a5f 0%, transparent 60%),
      radial-gradient(800px 400px at 110% 110%, #1b3b34 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
  }

  .card {
    background: linear-gradient(180deg, rgba(30, 44, 72, 0.95), rgba(20, 31, 53, 0.95));
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }

  .head {
    padding: 26px 20px 22px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(140deg, rgba(110, 231, 183, 0.10), rgba(125, 211, 252, 0.06));
  }

  .avatar {
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    line-height: 1;
    border-radius: 20px;
    background: rgba(110, 231, 183, 0.12);
    border: 1px solid rgba(110, 231, 183, 0.4);
    margin-bottom: 14px;
  }

  h1 {
    margin: 0;
    font-size: clamp(24px, 7vw, 32px);
    line-height: 1.25;
    letter-spacing: 0.5px;
    overflow-wrap: anywhere;
  }

  .tag {
    display: inline-block;
    margin-top: 10px;
    padding: 3px 10px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--accent);
    background: rgba(110, 231, 183, 0.10);
    border: 1px solid rgba(110, 231, 183, 0.35);
    border-radius: 999px;
  }

  .body {
    padding: 22px 20px 26px;
  }

  .intro {
    margin: 0;
    padding: 14px 16px;
    font-size: clamp(15px, 4.2vw, 17px);
    color: var(--text);
    background: rgba(125, 211, 252, 0.08);
    border-left: 3px solid var(--accent-2);
    border-radius: 0 12px 12px 0;
    overflow-wrap: anywhere;
  }

  .intro strong {
    color: var(--accent-2);
    font-weight: 600;
  }

  h2 {
    margin: 28px 0 12px;
    font-size: 16px;
    letter-spacing: 1px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
    min-width: 20px;
  }

  .goals {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 12px;
  }

  .goals li {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 12px;
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
  }

  .num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #07231a;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }

  .goals p {
    margin: 0;
    font-size: 15px;
    color: var(--text);
    overflow-wrap: anywhere;
  }

  .goals p + p {
    margin-top: 6px;
    font-size: 14px;
    color: var(--muted);
  }

  code {
    padding: 1px 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9em;
    color: var(--accent);
    background: rgba(110, 231, 183, 0.10);
    border: 1px solid rgba(110, 231, 183, 0.25);
    border-radius: 6px;
    white-space: nowrap;
  }

  .foot {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    color: #07231a;
    text-decoration: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 999px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .btn:hover {
    transform: translateY(-1px);
    opacity: 0.92;
  }

  .btn:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  .btn svg {
    width: 16px;
    height: 16px;
    flex: none;
    fill: currentColor;
  }

  .hint {
    font-size: 13px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  @media (max-width: 360px) {
    body {
      padding: 12px 10px 28px;
      font-size: 15px;
    }

    .head,
    .body {
      padding-left: 14px;
      padding-right: 14px;
    }

    .card {
      border-radius: 14px;
    }

    .goals li {
      grid-template-columns: 24px 1fr;
      gap: 10px;
      padding: 12px;
    }

    .num {
      width: 24px;
      height: 24px;
      font-size: 13px;
    }

    .btn {
      width: 100%;
      justify-content: center;
    }
  }
</style>
</head>
<body>
  <main class="wrap">
    <article class="card">
      <header class="head">
        <div class="avatar" aria-hidden="true">🌱</div>
        <h1>hr28an</h1>
        <span class="tag">Git 学习者在路上</span>
      </header>

      <div class="body">
        <p class="intro">
          我是 <strong>hr28an</strong>，正在系统学习 Git 与团队协作，
          第一次完整走一遍「分支 → 提交 → PR」的流程。
        </p>

        <h2>学习目标</h2>
        <ol class="goals">
          <li>
            <span class="num" aria-hidden="true">1</span>
            <div>
              <p>搞清楚工作区、暂存区和本地提交的关系：能讲明白 <code>git add</code> 挑了什么、<code>git commit</code> 存了什么，并独立完成一次从改文件到写提交的完整记录。</p>
            </div>
          </li>
          <li>
            <span class="num" aria-hidden="true">2</span>
            <div>
              <p>按团队规范完成一次可审核的协作：用规范的分支名和提交信息发起 PR，在正文里写清改动与自查结果，并且能回应评审意见后继续更新这个 PR。</p>
            </div>
          </li>
        </ol>

        <footer class="foot">
          <a class="btn" href="https://github.com/hr28an" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
            </svg>
            github.com/hr28an
          </a>
          <span class="hint">欢迎交流，一起把流程走顺 ✨</span>
        </footer>
      </div>
    </article>
  </main>
</body>
</html>
