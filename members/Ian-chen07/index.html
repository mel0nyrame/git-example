<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ian 的自我介绍：18 岁，喜欢画画。">
  <meta name="theme-color" content="#f7f5f1">
  <title>Ian · 自我介绍</title>
  <style>
    :root {
      --paper: #f7f5f1;
      --ink: #24211d;
      --muted: #6f6860;
      --line: #e2ddd4;
      --accent: #a84b26;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 64px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                   -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: #ead9cd;
    }

    main {
      width: 100%;
      max-width: 620px;
      animation: rise 0.8s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 28px;
      font-size: 12px;
      letter-spacing: 0.24em;
      color: var(--muted);
    }

    .eyebrow::before {
      content: "";
      width: 32px;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino,
                   Georgia, "Songti SC", "Noto Serif SC", serif;
      font-size: clamp(64px, 14vw, 104px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    h1 .dot {
      color: var(--accent);
    }

    .lead {
      margin: 24px 0 0;
      font-size: clamp(20px, 3.4vw, 24px);
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: 0.01em;
    }

    .intro {
      margin: 28px 0 0;
      max-width: 30em;
      color: #4a453e;
      text-align: justify;
    }

    .intro p { margin: 0; }
    .intro p + p { margin-top: 12px; }

    .facts {
      margin: 40px 0 0;
      border-top: 1px solid var(--line);
    }

    .fact {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .fact dt {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .fact dd {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
    }

    footer {
      margin-top: 48px;
      font-size: 13.5px;
      color: var(--muted);
    }

    footer .sign {
      color: var(--accent);
    }

    @media (max-width: 480px) {
      body { padding: 48px 22px; }
      .fact { padding: 12px 0; }
      footer { margin-top: 36px; }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">自我介绍</p>

    <h1>Ian<span class="dot">.</span></h1>
    <p class="lead">18 岁，喜欢画画。</p>

    <div class="intro">
      <p>我喜欢用画笔记录日常里的光影和情绪。对我来说，画画是一种安静的表达方式，也让我从另一个角度观察世界。</p>
      <p>很高兴认识你，希望以后能一起交流、一起进步。</p>
    </div>

    <dl class="facts">
      <div class="fact">
        <dt>姓名</dt>
        <dd>Ian</dd>
      </div>
      <div class="fact">
        <dt>年龄</dt>
        <dd>18 岁</dd>
      </div>
      <div class="fact">
        <dt>兴趣爱好</dt>
        <dd>画画</dd>
      </div>
    </dl>

    <footer>简单记录，慢慢成长。 <span class="sign">— Ian</span></footer>
  </main>
</body>
</html>
