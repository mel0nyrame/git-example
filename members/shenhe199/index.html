<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>青春猪头少年不会梦到亲爱好朋友</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* 保持深邃的星空蓝背景 */
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #ffffff;
            font-family: 'Microsoft YaHei', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* 巨大的标题，撑起整个页面 */
        h1 {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 40px;
            background: -webkit-linear-gradient(#e0c3fc, #8ec5fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 0 20px;
            line-height: 1.3;
            letter-spacing: 2px;
        }

        /* 超大号的经典标语，发光特效 */
        .slogan {
            font-size: 2.8rem;
            color: #ff9a9e;
            text-shadow: 0 0 15px #ff9a9e, 0 0 30px #ff9a9e;
            margin: 30px 0;
            font-weight: bold;
            letter-spacing: 4px;
            animation: glow 2s infinite alternate;
            padding: 0 20px;
        }

        /* 下方的信息卡片 */
        .info-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            max-width: 80vw;
            margin-top: 20px;
            transition: transform 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .info-card p {
            font-size: 1.2rem;
            line-height: 2;
            color: #e0e0e0;
            margin: 0;
        }

        /* 呼吸灯动画 */
        @keyframes glow {
            from { 
                text-shadow: 0 0 10px #ff9a9e; 
                transform: scale(1);
            }
            to { 
                text-shadow: 0 0 30px #ff9a9e, 0 0 40px #ff9a9e; 
                transform: scale(1.02);
            }
        }
    </style>
</head>
<body>

    <h1>青春猪头少年不会梦到亲爱好朋友</h1>
    
    <!-- 放大版的专属标语 -->
    <div class="slogan">“人活着就是为了麻衣学姐！”</div>
    
    <div class="info-card">
        <p>🎬 系列最终剧场版 · 完结篇！</p>
        <p>日本定档：2026年10月16日</p>
        <p>港澳地区：2026年11月26日</p>
        <hr style="border: 0; height: 1px; background: rgba(255,255,255,0.2); margin: 15px 0;">
        <p style="font-size: 1rem; color: #a0a0a0;">—— 由 AI 辅助搭建的个人首站 ——</p>
    </div>

</body>
</html>
