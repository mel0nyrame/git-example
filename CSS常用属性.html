<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS常用属性</title>
    <style>
        .block{
            background-color: aqua;
            width: 130px;
        }
        .inline{
            background-color: brown;
        }
        .inline-block{
            width: 240px;
            height: 160px;
        }
        .div-inline{
            display: inline;
            background-color: blue;
        }
        .span-inline-block{
            display: inline-block;
            background-color: brown;
            width: 100px;
        }
    </style>
</head>
<body>
<h1 style="font: bolder 50px 'kaiti';">这是一个font 符合属性</h1>
<p style="line-height: 99px;"></p>
<div class="block">这是一个块级元素</div><br><br>
<span class="inline">这是一个行内元素</span><br><br>
<img src="./Capture001.png" alt="" class="inline-block"><br><br>
<div style="display: inline ; background-color: aquamarine;" >这是一个转换成行内元素的div标签（行内样式）</div><br><br>
<div class="div-inline">同上（内部样式）</div><br><br>
<span class="span-inline-block">这是一个转换成行内块元素的span标签</span>
</body>
</html>
